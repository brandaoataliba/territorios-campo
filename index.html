<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#4a6da7">
  <title>Territórios | Campo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f2;
      color: #2f3437;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .test-bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      background: #e8edf4;
      border-bottom: 1px solid #d9dee7;
      font-size: 13px;
    }

    .test-bar a {
      color: #36537f;
      font-weight: bold;
      padding: 6px 0;
    }

    iframe {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #f4f4f2;
    }

    #error {
      padding: 20px;
      color: #a92d2d;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="test-bar">
    <span>Campo · acesso de teste</span>

    <a id="direct"
       target="_blank"
       rel="noopener noreferrer"
       hidden>
      Abrir diretamente no Google
    </a>
  </div>

  <p id="error" role="alert" hidden></p>

  <iframe
    id="field-app"
    title="Aplicativo de Campo"
    referrerpolicy="no-referrer"
    allow="clipboard-write"
    hidden>
  </iframe>

  <noscript>
    Ative o JavaScript do navegador para abrir o Campo.
  </noscript>

  <script>
    (() => {
      "use strict";

      const APP_URL =
        "https://script.google.com/macros/s/AKfycbxw8Ub9PKXwlSRNQp2vqJ3Z9m5ud-a97TlzAZea3leU3EoOFXmXcUlj-dLuLPiqdicU/exec";

      const frame = document.getElementById("field-app");
      const direct = document.getElementById("direct");
      const error = document.getElementById("error");

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      function openField() {
        const params = new URLSearchParams(window.location.search);
        const target = new URL(APP_URL);

        const hasTerritory = params.has("t");
        const hasKey = params.has("k");

        if (hasTerritory || hasKey) {
          const territory = params.get("t") || "";
          const key = params.get("k") || "";

          const valid =
            params.getAll("t").length === 1 &&
            params.getAll("k").length === 1 &&
            /^[1-9][0-9]{0,3}$/.test(territory) &&
            /^[a-f0-9]{64}$/.test(key);

          if (!valid) {
            showError(
              "Link de território incompleto ou inválido. " +
              "Peça ao responsável que envie novamente o link completo."
            );
            return;
          }

          target.searchParams.set("t", territory);
          target.searchParams.set("k", key);
        }

        // A autorização continua sendo feita pelo Apps Script.
        // Nenhuma chave de território fica gravada neste arquivo.
        direct.href = target.href;
        direct.hidden = false;

        frame.src = target.href;
        frame.hidden = false;
      }

      openField();
    })();
  </script>
</body>
</html>
